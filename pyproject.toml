[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchreadernerd"
version = "0.1.0"
description = "Answer a reader's questions about a scientific paper, with every claim tied to its source."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.1,<3", "httpx2>=2.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: FastAPI's TestClient
aws = ["boto3>=1.34"]  # S3 storage in production

[project.scripts]
rrn = "researchreadernerd.cli:main"
rrn-web = "researchreadernerd.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchreadernerd = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
